ci:
  autoupdate_schedule: monthly
  autofix_commit_msg: "style(pre-commit.ci): auto fixes [...]"
  autoupdate_commit_msg: "ci(pre-commit.ci): autoupdate"


repos:
  - repo: https://github.com/jupytext/jupytext
    rev: v1.19.4
    hooks:
      - id: jupytext
        files: ^solutions/.*\.(ipynb|py)$
        args: [--sync, --pipe, "black - --target-version py313"]
        additional_dependencies:
          - black==26.5.1

  - repo: local
    hooks:
      - id: strip-exercise-code
        name: strip exercise code
        entry: uv run python scripts/strip_exercise_blocks.py --in-place
        language: system
        files: ^exercises/.*\.ipynb$
        pass_filenames: true
        require_serial: true

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
        args: [--target-version=py313]

  # strip out jupyter notebooks
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
